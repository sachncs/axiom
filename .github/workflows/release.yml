name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  verify:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify release version and tag
        run: |
          project_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          tag_version="${GITHUB_REF_NAME#v}"
          case "$project_version" in
            *dev*|*a*|*b*|*rc*)
              echo "Refusing to publish prerelease version: $project_version"
              exit 1
              ;;
          esac
          test "$project_version" = "$tag_version"

      - name: Enforce Basic and Multilevel qualification gates
        run: python scripts/verify_qualification.py --manifest qualification.json --release

      - name: Refuse a major release with documented implementation gaps
        run: |
          project_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          major_version="${project_version%%.*}"
          if [ "$major_version" -ge 1 ] && rg -n 'IMPLEMENTATION-GAP' docs/paper_restatement.md; then
            echo "Refusing a major release while paper implementation gaps remain"
            exit 1
          fi

      - name: Run release quality gates
        run: |
          python -m pip install -e ".[dev]"
          pytest -q
          ruff format --check axiom/ tests/ scripts/ benchmarks/ examples/
          ruff check .
          mypy axiom

  build-wheels:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify
    name: Release wheels (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
            arch: x86_64
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            arch: aarch64
          - platform: macos-x86_64
            runner: macos-15-intel
            arch: x86_64
          - platform: macos-arm64
            runner: macos-14
            arch: arm64
          - platform: windows-x86_64
            runner: windows-2025
            arch: AMD64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up wheel builder Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pinned wheel builder
        run: python -m pip install --disable-pip-version-check cibuildwheel==4.2.1

      - name: Build and test CPython wheels
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-*"
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_TEST_COMMAND: "python -I {project}/scripts/verify_install.py"
        run: python -m cibuildwheel --output-dir wheelhouse

      - name: Verify supported Python wheel coverage
        run: |
          set -euo pipefail
          for abi in cp310 cp311 cp312 cp313; do
            if ! compgen -G "wheelhouse/*-${abi}-${abi}-*.whl" > /dev/null; then
              echo "Missing $abi wheel for ${{ matrix.platform }}"
              exit 1
            fi
          done
          find wheelhouse -maxdepth 1 -type f -name '*.whl' -print | sort

      - name: Retain release wheels
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: axiom-release-wheels-${{ matrix.platform }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [verify, build-wheels]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Download every platform wheel artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: axiom-release-wheels-*
          path: dist
          merge-multiple: true

      - name: Verify release wheel matrix completeness
        run: |
          set -euo pipefail
          for abi in cp310 cp311 cp312 cp313; do
            for tag in 'manylinux*_x86_64' 'manylinux*aarch64' 'macosx_*_x86_64' 'macosx_*_arm64' 'win_amd64'; do
              if ! compgen -G "dist/*-${abi}-${abi}-${tag}.whl" > /dev/null; then
                echo "Missing release wheel for $abi / $tag"
                exit 1
              fi
            done
          done
          python -m pip install --disable-pip-version-check build twine
          python -m build --sdist --outdir dist
          python -m twine check dist/*
          for wheel in dist/*.whl; do
            if unzip -l "$wheel" | grep -q 'axiom/invariant.py'; then
              echo "Deleted compatibility module found in $wheel"
              exit 1
            fi
          done
          if tar -tf dist/*.tar.gz | grep -q 'axiom/invariant.py'; then
            echo "Deleted compatibility module found in source distribution"
            exit 1
          fi
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l)" -eq 20
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 1

      - name: Verify reproducible source distribution
        run: |
          first="$RUNNER_TEMP/axiom-release-one"
          second="$RUNNER_TEMP/axiom-release-two"
          SOURCE_DATE_EPOCH=0 python -m build --sdist --outdir "$first"
          SOURCE_DATE_EPOCH=0 python -m build --sdist --outdir "$second"
          python scripts/normalize_sdist.py dist/*.tar.gz "$first"/*.tar.gz "$second"/*.tar.gz
          cmp \
            <(sha256sum dist/*.tar.gz | cut -d ' ' -f 1) \
            <(sha256sum "$first"/*.tar.gz | cut -d ' ' -f 1)
          cmp \
            <(sha256sum "$first"/*.tar.gz | cut -d ' ' -f 1) \
            <(sha256sum "$second"/*.tar.gz | cut -d ' ' -f 1)

      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: "dist/*"

      - name: Prepare artifacts for detached signing
        run: |
          mkdir -p signed
          cp dist/*.whl dist/*.tar.gz signed/

      - name: Sign release artifacts with Sigstore
        uses: sigstore/gh-action-sigstore-python@5b79a39c381910c090341a2c9b0bf022c8b387e1 # v3.4.0
        with:
          inputs: signed/*

      - name: Publish to PyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

      - name: Generate release checksums
        run: sha256sum dist/*.whl dist/*.tar.gz > dist/SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* signed/* --generate-notes
