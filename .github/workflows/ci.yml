name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check axiom/ tests/ scripts/ benchmarks/ examples/

      - name: Check formatting with ruff
        run: ruff format --check axiom/ tests/ scripts/ benchmarks/ examples/

      - name: Type check with mypy
        run: mypy axiom/

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test with pytest
        run: pytest --cov=axiom --cov-report=xml --cov-fail-under=80 tests/

      - name: Test with optimized Python
        env:
          PYTHONOPTIMIZE: "1"
        run: pytest -q tests/

      - name: Native storage sanitizers
        if: matrix.python-version == '3.12'
        run: |
          clang++ -std=c++17 -fsanitize=address,undefined -fno-omit-frame-pointer -O1 -g native/test_storage.cpp -o "$RUNNER_TEMP/axiom-storage-test"
          "$RUNNER_TEMP/axiom-storage-test"
          clang++ -std=c++17 -fsanitize=address,undefined -fno-omit-frame-pointer -O1 -g native/test_engine.cpp -o "$RUNNER_TEMP/axiom-engine-test"
          "$RUNNER_TEMP/axiom-engine-test"

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@5a1091511ad55cbe89839c7260b706298ca349f7 # v5.5.1
        with:
          files: ./coverage.xml

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build and validate artifacts
        run: |
          python -m pip install --upgrade pip build twine
          rm -rf build dist axiom_matching.egg-info
          python -m build
          python -m twine check dist/*
          if unzip -l dist/*.whl | grep -q 'axiom/invariant.py'; then
            echo "Deleted compatibility module found in wheel"
            exit 1
          fi
          if tar -tf dist/*.tar.gz | grep -q 'axiom/invariant.py'; then
            echo "Deleted compatibility module found in source distribution"
            exit 1
          fi

      - name: Verify reproducible artifacts
        run: |
          first="$RUNNER_TEMP/axiom-build-one"
          second="$RUNNER_TEMP/axiom-build-two"
          SOURCE_DATE_EPOCH=0 python -m build --outdir "$first"
          SOURCE_DATE_EPOCH=0 python -m build --outdir "$second"
          python scripts/normalize_sdist.py "$first"/*.tar.gz "$second"/*.tar.gz
          diff -u \
            <(sha256sum "$first"/* | sed "s#$first/##" | sort) \
            <(sha256sum "$second"/* | sed "s#$second/##" | sort)

      - name: Install wheel in a clean environment
        run: |
          python -m venv /tmp/axiom-wheel-env
          /tmp/axiom-wheel-env/bin/pip install dist/*.whl
          /tmp/axiom-wheel-env/bin/python -I scripts/verify_install.py
          /tmp/axiom-wheel-env/bin/axiom --n 8 --mode multilevel --updates 4 --seed 1

      - name: Install source distribution in a clean environment
        run: |
          python -m venv /tmp/axiom-source-env
          /tmp/axiom-source-env/bin/pip install dist/*.tar.gz
          /tmp/axiom-source-env/bin/python -I scripts/verify_install.py
          /tmp/axiom-source-env/bin/axiom --n 8 --mode multilevel --updates 4 --seed 1

      - name: Audit dependencies
        run: |
          python -m pip install pip-audit
          python - <<'PY'
          import subprocess

          try:
              subprocess.run(["pip-audit"], check=True, timeout=120)
          except subprocess.TimeoutExpired as error:
              raise SystemExit(
                  "pip-audit did not complete within 120 seconds; "
                  "dependency security status is unverified"
              ) from error
          PY

  cross-platform-wheels:
    name: Wheels (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
            arch: x86_64
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            arch: aarch64
          - platform: macos-x86_64
            runner: macos-15-intel
            arch: x86_64
          - platform: macos-arm64
            runner: macos-14
            arch: arm64
          - platform: windows-x86_64
            runner: windows-2025
            arch: AMD64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up wheel builder Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned wheel builder
        run: python -m pip install --disable-pip-version-check cibuildwheel==4.2.1

      - name: Build and test CPython wheels
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-*"
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_TEST_COMMAND: "python -I {project}/scripts/verify_install.py"
        run: python -m cibuildwheel --output-dir wheelhouse

      - name: Verify supported Python wheel coverage
        run: |
          set -euo pipefail
          for abi in cp310 cp311 cp312 cp313; do
            if ! compgen -G "wheelhouse/*-${abi}-${abi}-*.whl" > /dev/null; then
              echo "Missing $abi wheel for ${{ matrix.platform }}"
              exit 1
            fi
          done
          find wheelhouse -maxdepth 1 -type f -name '*.whl' -print | sort

      - name: Retain validated wheels
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: axiom-wheels-${{ matrix.platform }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 14

  clean-install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Build artifacts
        run: |
          python -m pip install --upgrade pip build
          rm -rf build dist axiom_matching.egg-info
          python -m build

      - name: Install wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/axiom-wheel-${{ matrix.python-version }}"
          "$RUNNER_TEMP/axiom-wheel-${{ matrix.python-version }}/bin/pip" install dist/*.whl
          "$RUNNER_TEMP/axiom-wheel-${{ matrix.python-version }}/bin/python" -I scripts/verify_install.py
          "$RUNNER_TEMP/axiom-wheel-${{ matrix.python-version }}/bin/axiom" --n 10 --mode multilevel --updates 8 --seed 1

      - name: Install source distribution in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/axiom-source-${{ matrix.python-version }}"
          "$RUNNER_TEMP/axiom-source-${{ matrix.python-version }}/bin/pip" install dist/*.tar.gz
          "$RUNNER_TEMP/axiom-source-${{ matrix.python-version }}/bin/python" -I scripts/verify_install.py
          "$RUNNER_TEMP/axiom-source-${{ matrix.python-version }}/bin/axiom" --n 10 --mode multilevel --updates 8 --seed 1

  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run bounded adversarial multilevel stress test
        run: timeout --signal=TERM 60s python -m pytest -q tests/test_property.py

  resources:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build and install isolated resource-test wheel
        run: |
          python -m pip install build
          python -m build --wheel
          python -m venv "$RUNNER_TEMP/axiom-envelope-env"
          "$RUNNER_TEMP/axiom-envelope-env/bin/pip" install dist/*.whl

      - name: Enforce 512 MiB address space and a dedicated 192 MiB filesystem
        shell: bash
        run: |
          stage=$(mktemp -d "$RUNNER_TEMP/axiom-envelope.XXXXXX")
          image="$stage/disk.ext4"
          mount="$stage/volume"
          mkdir "$mount"
          truncate -s 192M "$image"
          mkfs.ext4 -F -m 0 "$image"
          sudo mount -o loop,nosuid,nodev "$image" "$mount"
          trap 'sudo umount "$mount"' EXIT
          sudo chown "$(id -u):$(id -g)" "$mount"
          timeout --signal=TERM 360s \
            "$RUNNER_TEMP/axiom-envelope-env/bin/python" -I \
            scripts/verify_resource_envelope.py --directory "$mount" --growth \
            | tee "$RUNNER_TEMP/resource-envelope.json"

      - name: Retain resource qualification report in job logs
        if: always()
        run: |
          if test -s "$RUNNER_TEMP/resource-envelope.json"; then
            cat "$RUNNER_TEMP/resource-envelope.json"
          fi

  workflow-security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install workflow scanner
        run: python -m pip install zizmor

      - name: Scan GitHub Actions workflows
        run: zizmor .github/workflows
