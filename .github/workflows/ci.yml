name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check axiom/ tests/ scripts/ benchmarks/ examples/

      - name: Check formatting with ruff
        run: ruff format --check axiom/ tests/ scripts/ benchmarks/ examples/

      - name: Type check with mypy
        run: mypy axiom/

  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test with pytest
        run: pytest --cov=axiom --cov-report=xml --cov-fail-under=80 tests/

      - name: Test with optimized Python
        env:
          PYTHONOPTIMIZE: "1"
        run: pytest -q tests/

      - name: Native storage sanitizers
        if: matrix.python-version == '3.12'
        run: |
          clang++ -std=c++17 -fsanitize=address,undefined -fno-omit-frame-pointer -O1 -g native/test_storage.cpp -o "$RUNNER_TEMP/axiom-storage-test"
          "$RUNNER_TEMP/axiom-storage-test"
          clang++ -std=c++17 -fsanitize=address,undefined -fno-omit-frame-pointer -O1 -g native/test_engine.cpp -o "$RUNNER_TEMP/axiom-engine-test"
          "$RUNNER_TEMP/axiom-engine-test"

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@5a1091511ad55cbe89839c7260b706298ca349f7 # v5.5.1
        with:
          files: ./coverage.xml

  package:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build and validate artifacts
        run: |
          python -m pip install --upgrade pip build twine
          rm -rf build dist axiom_matching.egg-info
          python -m build
          python -m twine check dist/*
          if unzip -l dist/*.whl | grep -q 'axiom/invariant.py'; then
            echo "Deleted compatibility module found in wheel"
            exit 1
          fi
          if tar -tf dist/*.tar.gz | grep -q 'axiom/invariant.py'; then
            echo "Deleted compatibility module found in source distribution"
            exit 1
          fi

      - name: Verify reproducible artifacts
        run: |
          first="$RUNNER_TEMP/axiom-build-one"
          second="$RUNNER_TEMP/axiom-build-two"
          SOURCE_DATE_EPOCH=0 python -m build --outdir "$first"
          SOURCE_DATE_EPOCH=0 python -m build --outdir "$second"
          python scripts/normalize_sdist.py "$first"/*.tar.gz "$second"/*.tar.gz
          diff -u \
            <(sha256sum "$first"/* | sed "s#$first/##" | sort) \
            <(sha256sum "$second"/* | sed "s#$second/##" | sort)

      - name: Install wheel in a clean environment
        run: |
          python -m venv /tmp/axiom-wheel-env
          /tmp/axiom-wheel-env/bin/pip install dist/*.whl
          /tmp/axiom-wheel-env/bin/python -I -c "from axiom import Matcher, Packed; from axiom.engine import Engine; g = Packed(16); g.ring(); m = Matcher(16, graph=g, mode='multilevel'); m.insert(0, 4); assert m.maximal() and g.check(); e = Engine(16); e.ring(); t = e.begin(); e.delete(0, 1); e.rollback(t); assert e.check() and e.has_edge(0, 1); s = e.snapshot(); r = Engine.restore(s); assert r.snapshot() == s and r.check()"
          /tmp/axiom-wheel-env/bin/python -I -c "from tempfile import TemporaryDirectory; from pathlib import Path; from axiom.durable import Durable, Request; t = TemporaryDirectory(); p = Path(t.name) / 'graph.db'; d = Durable(p, n=16); r = d.apply([Request(1, 'delete', 0, 1)]); d.close(); d = Durable(p); assert d.apply([Request(1, 'delete', 0, 1)]) == r and d.check(); d.close(); t.cleanup()"
          /tmp/axiom-wheel-env/bin/python -I scripts/verify_durable_install.py
          /tmp/axiom-wheel-env/bin/axiom --n 8 --mode multilevel --updates 4 --seed 1

      - name: Install source distribution in a clean environment
        run: |
          python -m venv /tmp/axiom-source-env
          /tmp/axiom-source-env/bin/pip install dist/*.tar.gz
          /tmp/axiom-source-env/bin/python -I -c "from axiom import Matcher, Packed; from axiom.engine import Engine; g = Packed(16); g.ring(); m = Matcher(16, graph=g, mode='multilevel'); m.insert(0, 4); assert m.maximal() and g.check(); e = Engine(16); e.ring(); t = e.begin(); e.delete(0, 1); e.rollback(t); assert e.check() and e.has_edge(0, 1); s = e.snapshot(); r = Engine.restore(s); assert r.snapshot() == s and r.check()"
          /tmp/axiom-source-env/bin/python -I -c "from tempfile import TemporaryDirectory; from pathlib import Path; from axiom.durable import Durable, Request; t = TemporaryDirectory(); p = Path(t.name) / 'graph.db'; d = Durable(p, n=16); r = d.apply([Request(1, 'delete', 0, 1)]); d.close(); d = Durable(p); assert d.apply([Request(1, 'delete', 0, 1)]) == r and d.check(); d.close(); t.cleanup()"
          /tmp/axiom-source-env/bin/python -I scripts/verify_durable_install.py
          /tmp/axiom-source-env/bin/axiom --n 8 --mode multilevel --updates 4 --seed 1

      - name: Audit dependencies
        run: |
          python -m pip install pip-audit
          python - <<'PY'
          import subprocess

          try:
              subprocess.run(["pip-audit"], check=True, timeout=120)
          except subprocess.TimeoutExpired as error:
              raise SystemExit(
                  "pip-audit did not complete within 120 seconds; "
                  "dependency security status is unverified"
              ) from error
          PY

  clean-install:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Build artifacts
        run: |
          python -m pip install --upgrade pip build
          rm -rf build dist axiom_matching.egg-info
          python -m build

      - name: Install wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/axiom-wheel-${{ matrix.python-version }}"
          "$RUNNER_TEMP/axiom-wheel-${{ matrix.python-version }}/bin/pip" install dist/*.whl
          "$RUNNER_TEMP/axiom-wheel-${{ matrix.python-version }}/bin/python" -I -c "from axiom import Matcher, Packed; from axiom.engine import Engine; g = Packed(16); g.ring(); m = Matcher(16, graph=g, mode='multilevel'); m.insert(0, 4); assert m.maximal() and g.check(); e = Engine(16); e.ring(); t = e.begin(); e.delete(0, 1); e.rollback(t); assert e.check() and e.has_edge(0, 1); s = e.snapshot(); r = Engine.restore(s); assert r.snapshot() == s and r.check()"
          "$RUNNER_TEMP/axiom-wheel-${{ matrix.python-version }}/bin/python" -I -c "from tempfile import TemporaryDirectory; from pathlib import Path; from axiom.durable import Durable, Request; t = TemporaryDirectory(); p = Path(t.name) / 'graph.db'; d = Durable(p, n=16); r = d.apply([Request(1, 'delete', 0, 1)]); d.close(); d = Durable(p); assert d.apply([Request(1, 'delete', 0, 1)]) == r and d.check(); d.close(); t.cleanup()"
          "$RUNNER_TEMP/axiom-wheel-${{ matrix.python-version }}/bin/python" -I scripts/verify_durable_install.py
          "$RUNNER_TEMP/axiom-wheel-${{ matrix.python-version }}/bin/axiom" --n 10 --mode multilevel --updates 8 --seed 1

      - name: Install source distribution in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/axiom-source-${{ matrix.python-version }}"
          "$RUNNER_TEMP/axiom-source-${{ matrix.python-version }}/bin/pip" install dist/*.tar.gz
          "$RUNNER_TEMP/axiom-source-${{ matrix.python-version }}/bin/python" -I -c "from axiom import Matcher, Packed; from axiom.engine import Engine; g = Packed(16); g.ring(); m = Matcher(16, graph=g, mode='multilevel'); m.insert(0, 4); assert m.maximal() and g.check(); e = Engine(16); e.ring(); t = e.begin(); e.delete(0, 1); e.rollback(t); assert e.check() and e.has_edge(0, 1); s = e.snapshot(); r = Engine.restore(s); assert r.snapshot() == s and r.check()"
          "$RUNNER_TEMP/axiom-source-${{ matrix.python-version }}/bin/python" -I -c "from tempfile import TemporaryDirectory; from pathlib import Path; from axiom.durable import Durable, Request; t = TemporaryDirectory(); p = Path(t.name) / 'graph.db'; d = Durable(p, n=16); r = d.apply([Request(1, 'delete', 0, 1)]); d.close(); d = Durable(p); assert d.apply([Request(1, 'delete', 0, 1)]) == r and d.check(); d.close(); t.cleanup()"
          "$RUNNER_TEMP/axiom-source-${{ matrix.python-version }}/bin/python" -I scripts/verify_durable_install.py
          "$RUNNER_TEMP/axiom-source-${{ matrix.python-version }}/bin/axiom" --n 10 --mode multilevel --updates 8 --seed 1

  stress:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run bounded adversarial multilevel stress test
        run: timeout --signal=TERM 60s python -m pytest -q tests/test_property.py

  resources:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build and install isolated resource-test wheel
        run: |
          python -m pip install build
          python -m build --wheel
          python -m venv "$RUNNER_TEMP/axiom-envelope-env"
          "$RUNNER_TEMP/axiom-envelope-env/bin/pip" install dist/*.whl

      - name: Enforce 512 MiB address space and a dedicated 192 MiB filesystem
        run: |
          stage=$(mktemp -d "$RUNNER_TEMP/axiom-envelope.XXXXXX")
          image="$stage/disk.ext4"
          mount="$stage/volume"
          mkdir "$mount"
          truncate -s 192M "$image"
          mkfs.ext4 -F -m 0 "$image"
          sudo mount -o loop,nosuid,nodev "$image" "$mount"
          trap 'sudo umount "$mount"' EXIT
          sudo chown "$(id -u):$(id -g)" "$mount"
          timeout --signal=TERM 240s \
            "$RUNNER_TEMP/axiom-envelope-env/bin/python" -I \
            scripts/verify_resource_envelope.py --directory "$mount" \
            | tee "$RUNNER_TEMP/resource-envelope.json"

      - name: Retain resource qualification report in job logs
        if: always()
        run: |
          if test -s "$RUNNER_TEMP/resource-envelope.json"; then
            cat "$RUNNER_TEMP/resource-envelope.json"
          fi

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        run: npm ci
        working-directory: site

      - name: Check site types
        run: npm run check
        working-directory: site

      - name: Reject removed API names in shipped docs
        run: |
          if rg -n -i 'tiered|from_mode|GreedyColorer|VizingColorer|Matcher\.(augment|try_augment|flip|maintain_i3)' README.md docs site/src site/public; then
            echo "Removed or non-canonical API text found in shipped documentation"
            exit 1
          fi

      - name: Build documentation site
        run: npm run build
        working-directory: site

      - name: Execute verified documentation examples
        run: |
          python -m venv .docs-env
          .docs-env/bin/python -m pip install .
          .docs-env/bin/python scripts/verify_site_examples.py

      - name: Check generated routes and accessibility
        run: npm run check:links
        working-directory: site

  workflow-security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install workflow scanner
        run: python -m pip install zizmor

      - name: Scan GitHub Actions workflows
        run: zizmor .github/workflows
